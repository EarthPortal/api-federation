#webserver
server.servlet.context-path=
# caching
spring.cache.type=simple
# Database
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

# Authentification
jwt.secret=${JWT_SECRET:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
jwt.expiration=86400000

user.admin.password=${ADMIN_PASSWORD:change_me}
spring.codec.max-in-memory-size=100MB

springdoc.paths-to-match=/search/**,/artefacts,/artefacts/{id}

# Instance configuration (overridable per container via env). Defaults preserve the full "gateway" behaviour.
# Databases config location: classpath:databases.json (all sources) or file:/path (e.g. OntoPortal-only federation).
gateway.databases-config=${DATABASES_CONFIG:classpath:databases.json}
# OpenAPI / Swagger metadata.
gateway.openapi.title=${OPENAPI_TITLE:API Federation Documentation}
gateway.openapi.description=${OPENAPI_DESCRIPTION:The EarthPortal API Federated Service is an advanced, dynamic solution designed to perform federated calls across multiple Terminology Services (TS). It offers search capabilities and supports responses in both JSON and JSON-LD formats.}
# Default output schema applied when the client omits targetDbSchema (empty = raw aggregated output).
gateway.default-target-db-schema=${DEFAULT_TARGET_DB_SCHEMA:}