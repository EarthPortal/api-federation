#webserver
server.servlet.context-path=
# caching
spring.cache.type=simple
# Database
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

# Authentification
jwt.secret=${JWT_SECRET:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
jwt.expiration=86400000

user.admin.password=${ADMIN_PASSWORD:change_me}
spring.codec.max-in-memory-size=100MB

springdoc.paths-to-match=/search/**,/artefacts,/artefacts/{id}
# Serve the Swagger UI at /docs instead of /swagger-ui/index.html
springdoc.swagger-ui.path=/docs

# Instance configuration (overridable per container via env). Defaults preserve the full "gateway" behaviour.
# Databases config location: classpath:databases.json (all sources) or file:/path (e.g. OntoPortal-only federation).
gateway.databases-config=${DATABASES_CONFIG:classpath:databases.json}
# OpenAPI / Swagger metadata (defaults describe the full gateway; federation overrides them via env).
gateway.openapi.title=${OPENAPI_TITLE:API Gateway}
gateway.openapi.description=${OPENAPI_DESCRIPTION:The EarthPortal API Gateway is a dynamic, federated service that performs federated calls across all configured Terminology Services (TS), including both OntoPortal and non-OntoPortal sources. It offers search and artefact metadata capabilities, aggregates and deduplicates results across sources, and supports responses in both JSON and JSON-LD formats. Its behaviour is governed by a JSON configuration file, allowing new sources to be added or existing ones modified without changing the code.}
# Default output schema applied when the client omits targetDbSchema (empty = raw aggregated output).
gateway.default-target-db-schema=${DEFAULT_TARGET_DB_SCHEMA:}